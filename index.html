<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otter Device Link</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    #flash-area {
      width: 100vw;
      height: 50vh;
      background: black;
    }

    .controls {
      padding: 16px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      font-size: 18px;
      margin: 8px 0 16px;
      padding: 8px;
    }

    label {
      display: block;
      margin-top: 8px;
    }

    button {
      font-size: 18px;
      padding: 10px 16px;
      margin-right: 8px;
    }

    .notice {
      margin-top: 24px;
      padding: 12px;
      background: #222;
      border-left: 4px solid #666;
      line-height: 1.7;
      font-size: 14px;
    }

    code {
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div id="flash-area"></div>

  <div class="controls">

    <label>SSID</label>
    <input id="ssid" type="text" placeholder="Wi-Fi SSID" />

    <label>パスワード</label>
    <input id="password" type="text" placeholder="Wi-Fi password" />

    <label>
      T: <span id="t-value">100</span> ms
    </label>

    <input
      id="t-slider"
      type="range"
      min="30"
      max="1000"
      value="100"
      step="5"
    />

    <button id="start-button">点滅開始</button>
    <button id="stop-button">停止</button>

    <div class="notice">
      UTF-8の1バイト文字にのみ対応しています。<br><br>

      T は小さいほど速く送れますが、読み取りに失敗しやすくなります。
      受け取れなかったら T を大きくしてください(デバイス側は T を自動で合わせます)。<br><br>

      WebサイトにSSID・パスワードを入力することに抵抗がある方は、
      ソースコードをダウンロードしてローカル環境で実行してください。<br><br>

      このページは入力内容を外部へ送信せず、
      ブラウザ内だけで光信号を生成します。<br><br>

      GitHub Pages上で動作しているため、
      ブラウザの開発者ツールから通信内容を確認できます。
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
